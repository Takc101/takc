<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DEATH NOTE - 笔记本</title>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cinzel:wght@400;700;900&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Cinzel', 'Noto Serif JP', serif;
            width: 100vw;
            height: 100vh;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #horror-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: all 2.2s cubic-bezier(0.7, 0, 0.3, 1);
            background: radial-gradient(ellipse at center, rgba(40, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.95) 70%);
        }
        #horror-modal.fall-away {
            transform: scale(0.02) rotateX(45deg) rotateY(-65deg) rotateZ(30deg) translateY(350px);
            opacity: 0;
            pointer-events: none;
        }
        #horror-content {
            text-align: center;
            padding: 20px;
            max-width: 90vw;
            animation: horrorPulse 2.5s ease-in-out infinite;
        }
        @keyframes horrorPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        .horror-text {
            font-family: 'UnifrakturCook', 'Cinzel', serif;
            font-size: clamp(32px, 8vw, 72px);
            font-weight: 700;
            color: #c0392b;
            text-shadow:
                0 0 10px rgba(139, 0, 0, 0.9),
                0 0 30px rgba(139, 0, 0, 0.6),
                0 0 60px rgba(139, 0, 0, 0.4),
                0 0 100px rgba(60, 0, 0, 0.8),
                0 4px 10px rgba(0, 0, 0, 0.7);
            letter-spacing: 4px;
            line-height: 1.2;
            margin-bottom: 15px;
            animation: bloodDripText 3.5s ease-in-out infinite;
        }
        @keyframes bloodDripText {
            0%, 100% { text-shadow: 0 0 10px rgba(139, 0, 0, 0.9), 0 0 30px rgba(139, 0, 0, 0.6), 0 0 60px rgba(139, 0, 0, 0.4), 0 0 100px rgba(60, 0, 0, 0.8), 0 4px 10px rgba(0, 0, 0, 0.7); }
            50% { text-shadow: 0 0 15px rgba(200, 0, 0, 0.95), 0 0 40px rgba(200, 0, 0, 0.7), 0 0 80px rgba(139, 0, 0, 0.5), 0 0 120px rgba(60, 0, 0, 0.9), 0 6px 15px rgba(0, 0, 0, 0.8); }
        }
        .horror-sub {
            font-family: 'Special Elite', 'Cinzel', serif;
            font-size: clamp(14px, 3vw, 24px);
            color: #8a0e0e;
            text-shadow: 0 0 8px rgba(139, 0, 0, 0.6), 0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 6px;
        }
        .blood-drop {
            position: absolute;
            width: 8px;
            height: 16px;
            background: #a01010;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: bloodFall 3s ease-in infinite;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.8);
            opacity: 0.8;
        }
        .blood-drop:nth-child(1) { left: 15%; top: -20px; animation-delay: 0.5s; }
        .blood-drop:nth-child(2) { left: 35%; top: -50px; animation-delay: 1.2s; }
        .blood-drop:nth-child(3) { left: 55%; top: -30px; animation-delay: 0.8s; }
        .blood-drop:nth-child(4) { left: 75%; top: -60px; animation-delay: 2s; }
        .blood-drop:nth-child(5) { left: 90%; top: -40px; animation-delay: 1.5s; }
        @keyframes bloodFall {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(110vh) scale(1.2); opacity: 0; }
        }
        #book-canvas {
            position: relative;
            z-index: 5;
            pointer-events: none;
            transition: all 2.5s cubic-bezier(0.7, 0, 0.3, 1);
            max-width: 95vw;
            max-height: 65vh;
            border-radius: 4px;
            display: none;
        }
        #book-canvas.visible { display: block; }
        #book-canvas.fly-away {
            transform: scale(0.02) rotateX(45deg) rotateY(-65deg) rotateZ(30deg) translateY(350px);
            opacity: 0;
        }
        #form-container {
            position: relative;
            z-index: 8;
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            margin-top: 20px;
            width: 90%;
            max-width: 700px;
        }
        #form-container.visible { opacity: 1; pointer-events: all; }
        #form-container.fade-out { opacity: 0; pointer-events: none; transition: all 0.6s ease-in; }
        .input-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .input-field { flex: 1 1 160px; min-width: 120px; max-width: 220px; }
        .input-field input {
            width: 100%;
            background: rgba(20, 0, 0, 0.88);
            border: 2px solid #3a1a1a;
            border-radius: 4px;
            padding: 12px 14px;
            font-family: 'Cinzel', 'Noto Serif JP', serif;
            font-size: 13px;
            color: #e0d5c0;
            letter-spacing: 1px;
            transition: all 0.4s ease;
            outline: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
        }
        .input-field input:focus {
            border-color: #8b0000;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.5), inset 0 0 16px rgba(139, 0, 0, 0.2);
            background: rgba(35, 0, 0, 0.92);
        }
        .input-field input::placeholder { color: #665; letter-spacing: 1px; font-size: 11px; }
        .submit-btn {
            background: linear-gradient(145deg, #1a0000 0%, #3a0000 50%, #1a0000 100%);
            border: 2px solid #6a1a1a;
            border-radius: 4px;
            padding: 12px 44px;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 700;
            color: #d4c9a8;
            letter-spacing: 6px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }
        .submit-btn:hover {
            border-color: #8b0000;
            color: #fff;
            box-shadow: 0 0 35px rgba(139, 0, 0, 0.7), inset 0 0 25px rgba(139, 0, 0, 0.3);
            letter-spacing: 8px;
        }
        .disclaimer { font-size: 8px; color: #443; letter-spacing: 3px; font-family: 'Cinzel', serif; text-align: center; }
        #light-scene {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2.5s ease-in;
            width: 280px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #light-scene.visible { opacity: 1; }
        #yagami-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 35px rgba(139, 0, 0, 0.5)) drop-shadow(0 0 70px rgba(60, 0, 0, 0.4)) drop-shadow(0 0 100px rgba(0, 0, 0, 0.5));
            animation: yagamiFloat 6s ease-in-out infinite;
            transition: filter 2s ease-in-out;
        }
        #light-scene.red-eye #yagami-img {
            filter: drop-shadow(0 0 45px rgba(255, 26, 26, 0.7)) drop-shadow(0 0 90px rgba(139, 0, 0, 0.5)) drop-shadow(0 0 120px rgba(0, 0, 0, 0.5)) brightness(1.05) saturate(1.1);
        }
        .red-eye-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2.5s ease-in;
            background: radial-gradient(ellipse at center 45%, rgba(255, 30, 30, 0.15) 0%, rgba(139, 0, 0, 0.08) 30%, transparent 60%);
            mix-blend-mode: screen;
        }
        #light-scene.red-eye .red-eye-overlay { opacity: 1; animation: redEyePulse 2.2s ease-in-out infinite; }
        @keyframes redEyePulse { 0%,100%{opacity:.6;} 50%{opacity:1;} }
        @keyframes yagamiFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
        #abyss-canvas { position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
        .ambient-glow {
            position: fixed; top:50%; left:50%; width:90vw; height:90vh;
            transform:translate(-50%,-50%);
            background:radial-gradient(ellipse at center, rgba(60,0,0,0.45) 0%, rgba(0,0,0,0) 70%);
            z-index:1; pointer-events:none;
            animation:ambientPulse 5s ease-in-out infinite;
        }
        @keyframes ambientPulse { 0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1);} 50%{opacity:.9;transform:translate(-50%,-50%) scale(1.1);} }
        #abyss-vortex {
            position: fixed; top:50%; left:50%; width:65vh; height:65vh; border-radius:50%;
            z-index:2; pointer-events:none; opacity:0; transition:opacity 2.5s ease-in;
            background:conic-gradient(from 0deg, rgba(20,0,0,0.5) 0%, rgba(60,0,0,0.3) 15%, rgba(0,0,0,0.7) 30%, rgba(40,0,0,0.4) 45%, rgba(0,0,0,0.8) 60%, rgba(60,0,0,0.3) 75%, rgba(20,0,0,0.5) 100%);
            filter:blur(10px); animation:vortexSpin 10s linear infinite;
        }
        #abyss-vortex.active { opacity:1; }
        @keyframes vortexSpin { 0%{transform:translate(-50%,-50%) rotate(0deg) scale(1);} 50%{transform:translate(-50%,-50%) rotate(180deg) scale(1.25);} 100%{transform:translate(-50%,-50%) rotate(360deg) scale(1);} }
        #danmaku-layer { position: fixed; top:0; left:0; width:100%; height:100%; z-index:3; pointer-events:none; overflow:hidden; }
        .danmaku-item {
            position:absolute; white-space:nowrap;
            font-family:'Cinzel','Noto Serif JP',serif; font-weight:700; font-size:17px;
            color:#ccc; text-shadow:0 0 8px rgba(139,0,0,.8),0 0 2px #fff,0 0 20px rgba(139,0,0,.4);
            letter-spacing:2px; animation:danmakuMove linear forwards; opacity:.9;
        }
        .danmaku-item .dm-time { color:#ff1a1a; font-weight:900; text-shadow:0 0 12px rgba(255,26,26,.9),0 0 4px #fff; }
        .danmaku-item .dm-name { color:#fff; font-weight:900; text-shadow:0 0 8px rgba(255,255,255,.6); }
        @keyframes danmakuMove { 0%{transform:translateX(105vw);} 100%{transform:translateX(-120%);} }
        #red-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background:radial-gradient(ellipse at center, rgba(180,0,0,.25) 0%, rgba(0,0,0,0) 65%);
            z-index:4; opacity:0; pointer-events:none; transition:opacity 3s ease-in;
        }
        #red-overlay.active { opacity:1; }
        .watermark {
            position: fixed; top:18px; left:50%; transform:translateX(-50%);
            font-family:'UnifrakturCook','Cinzel',serif; font-size:22px; letter-spacing:10px;
            color:rgba(80,40,40,0.7); z-index:7; pointer-events:none;
            text-shadow:0 0 18px rgba(139,0,0,0.5); transition:opacity 1s ease;
        }
        .watermark.hidden { opacity:0; }
        @media (max-width: 768px) {
            .input-field { min-width: 90px; max-width: 140px; }
            .input-field input { font-size: 11px; padding: 8px 8px; }
            .submit-btn { padding: 8px 24px; font-size: 12px; letter-spacing: 4px; }
            #light-scene { width: 190px; height: 270px; }
            .danmaku-item { font-size: 13px; }
            #book-canvas { max-height: 50vh; }
            .horror-text { font-size: 40px; }
        }
        @media (max-width: 420px) {
            .input-field { min-width: 70px; max-width: 100px; }
            .input-field input { font-size: 9px; padding: 6px 6px; }
            .submit-btn { padding: 6px 16px; font-size: 10px; letter-spacing: 3px; }
            #light-scene { width: 140px; height: 200px; }
            .danmaku-item { font-size: 10px; }
            #book-canvas { max-height: 40vh; }
            .horror-text { font-size: 28px; }
        }
    </style>
</head>
<body>

    <canvas id="abyss-canvas"></canvas>
    <div class="ambient-glow"></div>
    <div id="abyss-vortex"></div>
    <div id="danmaku-layer"></div>
    <div id="red-overlay"></div>
    <div class="watermark" id="watermark">DEATH NOTE</div>

    <!-- 背景音乐 -->
    <audio id="bgm" src="the-kness.mp3" autoplay loop preload="auto"></audio>

    <!-- 恐怖弹窗 -->
    <div id="horror-modal">
        <div class="blood-drop"></div>
        <div class="blood-drop"></div>
        <div class="blood-drop"></div>
        <div class="blood-drop"></div>
        <div class="blood-drop"></div>
        <div id="horror-content">
            <div class="horror-text">我可以帮你杀了激怒你的人</div>
            <div class="horror-sub">DEATH NOTE</div>
        </div>
    </div>

    <canvas id="book-canvas" width="720" height="520"></canvas>

    <div id="form-container">
        <div class="input-row">
            <div class="input-field"><input type="text" id="name-input" placeholder="名字" autocomplete="off" maxlength="30"></div>
            <div class="input-field"><input type="text" id="time-input" placeholder="死亡时间" autocomplete="off" maxlength="30"></div>
            <div class="input-field"><input type="text" id="event-input" placeholder="死亡地点/原因" autocomplete="off" maxlength="60"></div>
        </div>
        <button class="submit-btn" id="submit-btn">确 定</button>
        <div class="disclaimer">※ 仅供娱乐，切勿当真 ※</div>
    </div>

    <div id="light-scene">
        <img src="yagami-light.png" id="yagami-img" alt="夜神月">
        <div class="red-eye-overlay"></div>
    </div>

    <script>
        (function() {
            // 音乐播放
            const bgm = document.getElementById('bgm');
            // 尝试自动播放
            bgm.play().catch(() => {});
            // 如果被阻止，点击页面后播放
            document.addEventListener('click', () => {
                bgm.play().catch(() => {});
            }, { once: true });

            // ========== 深渊粒子 ==========
            const particleCanvas = document.getElementById('abyss-canvas');
            const pctx = particleCanvas.getContext('2d');
            let particles = [];
            function resizeParticleCanvas() { particleCanvas.width = window.innerWidth; particleCanvas.height = window.innerHeight; }
            resizeParticleCanvas();
            window.addEventListener('resize', resizeParticleCanvas);
            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * particleCanvas.width;
                    this.y = particleCanvas.height + Math.random() * 200;
                    this.size = Math.random() * 2 + 0.5;
                    this.speedY = Math.random() * 0.7 + 0.2;
                    this.speedX = (Math.random() - 0.5) * 0.3;
                    this.opacity = Math.random() * 0.6 + 0.1;
                    this.pulse = Math.random() * Math.PI * 2;
                    this.pulseSpeed = Math.random() * 0.02 + 0.005;
                }
                update() {
                    this.y -= this.speedY;
                    this.x += this.speedX;
                    this.pulse += this.pulseSpeed;
                    if (this.y < -20 || this.x < -20 || this.x > particleCanvas.width + 20) {
                        this.reset();
                        this.y = particleCanvas.height + 50;
                    }
                }
                draw() {
                    const a = this.opacity * (0.6 + 0.4 * Math.sin(this.pulse));
                    const s = this.size * (0.8 + 0.4 * Math.sin(this.pulse));
                    pctx.beginPath();
                    pctx.arc(this.x, this.y, s, 0, Math.PI * 2);
                    pctx.fillStyle = `rgba(130,35,35,${a})`;
                    pctx.fill();
                }
            }
            for (let i = 0; i < 70; i++) particles.push(new Particle());
            function animateParticles() {
                pctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animateParticles);
            }
            animateParticles();

            // ========== 弹幕 ==========
            const danmakuLayer = document.getElementById('danmaku-layer');
            const STORAGE_KEY = 'death_note_canvas_v4';
            function getRecords() { try { const d = localStorage.getItem(STORAGE_KEY); return d ? JSON.parse(d) : []; } catch { return []; } }
            function saveRecord(name, time, event) {
                const recs = getRecords();
                recs.push({ name, time, event, timestamp: Date.now() });
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(recs)); } catch(e) {}
                return recs;
            }
            function spawnDanmaku(record, delay = 0) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'danmaku-item';
                    el.style.top = (6 + Math.random() * 80) + '%';
                    el.style.fontSize = (14 + Math.random() * 8) + 'px';
                    el.style.animationDuration = (9 + Math.random() * 7) + 's';
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'dm-name'; nameSpan.textContent = record.name;
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'dm-time'; timeSpan.textContent = '  ' + record.time + '  ';
                    const eventSpan = document.createElement('span'); eventSpan.textContent = record.event || '...';
                    el.appendChild(nameSpan); el.appendChild(timeSpan); el.appendChild(eventSpan);
                    danmakuLayer.appendChild(el);
                    el.addEventListener('animationend', () => el.remove());
                }, delay);
            }
            function spawnAllDanmaku() {
                const recs = getRecords();
                if (recs.length === 0) return;
                const shuffled = [...recs].sort(() => Math.random() - 0.5);
                for (let i = 0; i < Math.min(shuffled.length, 6); i++) spawnDanmaku(shuffled[i], i * 800);
            }

            // ========== 恐怖弹窗控制 ==========
            const horrorModal = document.getElementById('horror-modal');
            const bookCanvas = document.getElementById('book-canvas');

            setTimeout(() => {
                horrorModal.classList.add('fall-away');
                setTimeout(() => {
                    horrorModal.style.display = 'none';
                    bookCanvas.classList.add('visible');
                    startBookAnimation();
                }, 2200);
            }, 3500);

            // ========== Canvas书本绘制 ==========
            const canvas = bookCanvas;
            const ctx = canvas.getContext('2d');
            const W = canvas.width;
            const H = canvas.height;

            const CLOSED_W = 300;
            const CLOSED_H = 440;
            const OPEN_W = 620;
            const OPEN_H = 440;
            const SPINE_W = 20;
            const PAGE_W = (OPEN_W - SPINE_W) / 2;
            const PAGE_H = OPEN_H;
            const CENTER_X = W / 2;
            const CENTER_Y = H / 2 - 20;

            let animState = 'idle';
            let animStartTime = null;
            const DROP_DURATION = 1800;
            const COVER_OPEN_DURATION = 2600;
            const FLIP_DURATION = 1800;
            let dropProgress = 0;
            let coverAngle = 0;
            let flipProgress = 0;

            function easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }

            function drawSpine(x, y, w, h) {
                const grad = ctx.createLinearGradient(x - w/2, 0, x + w/2, 0);
                grad.addColorStop(0, '#0d0805');
                grad.addColorStop(0.3, '#1a1008');
                grad.addColorStop(0.5, '#2d1d0e');
                grad.addColorStop(0.7, '#1a1008');
                grad.addColorStop(1, '#0d0805');
                ctx.fillStyle = grad;
                ctx.fillRect(x - w/2, y, w, h);
                ctx.strokeStyle = 'rgba(139,100,60,0.4)';
                ctx.lineWidth = 1;
                for (let ly = y + 20; ly < y + h - 20; ly += 28) {
                    ctx.beginPath();
                    ctx.moveTo(x - w/2 + 4, ly);
                    ctx.lineTo(x + w/2 - 4, ly);
                    ctx.stroke();
                }
                ctx.save();
                ctx.translate(x, y + h/2);
                ctx.rotate(-Math.PI/2);
                ctx.fillStyle = '#8a7050';
                ctx.font = 'bold 10px "UnifrakturCook", "Cinzel", serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('DEATH NOTE', 0, 0);
                ctx.restore();
            }

            function drawPaperBackground(x, y, w, h, isRule) {
                ctx.fillStyle = isRule ? '#f0e6d0' : '#fcf9f0';
                ctx.fillRect(x, y, w, h);
                for (let i = 0; i < w * h / 400; i++) {
                    const tx = x + Math.random() * w;
                    const ty = y + Math.random() * h;
                    ctx.fillStyle = `rgba(180,160,120,${Math.random() * 0.08})`;
                    ctx.fillRect(tx, ty, 1, 1);
                }
                if (isRule) {
                    ctx.strokeStyle = 'rgba(139,0,0,0.5)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x + 10, y + 10, w - 20, h - 20);
                }
            }

            function drawNotebookPage(x, y, w, h) {
                drawPaperBackground(x, y, w, h, false);
                ctx.strokeStyle = 'rgba(200,50,50,0.5)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x + 30, y + 15);
                ctx.lineTo(x + 30, y + h - 15);
                ctx.stroke();
                ctx.strokeStyle = 'rgba(140,160,200,0.45)';
                ctx.lineWidth = 1;
                for (let ly = y + 45; ly < y + h - 20; ly += 28) {
                    ctx.beginPath();
                    ctx.moveTo(x + 35, ly);
                    ctx.lineTo(x + w - 20, ly);
                    ctx.stroke();
                }
                ctx.fillStyle = '#444';
                ctx.font = 'bold 11px "Cinzel", serif';
                ctx.textAlign = 'center';
                ctx.fillText('DEATH NOTE', x + w/2, y + 30);
                ctx.fillStyle = '#333';
                ctx.font = '10px "Special Elite", "Cinzel", serif';
                ctx.textAlign = 'left';
                const fields = ['Name: ____', 'Time: ____', 'Place: ____', 'Cause: ____'];
                fields.forEach((f, i) => {
                    ctx.fillText(f, x + 40, y + 80 + i * 42);
                });
            }

            function drawRulePage(x, y, w, h, isRight) {
                drawPaperBackground(x, y, w, h, true);
                ctx.fillStyle = '#8b0000';
                ctx.font = 'bold 13px "UnifrakturCook", "Cinzel", serif';
                ctx.textAlign = 'center';
                ctx.fillText(isRight ? 'RULES OF' : 'DEATH NOTE', x + w/2, y + 30);
                ctx.strokeStyle = 'rgba(139,0,0,0.5)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x + 20, y + 40);
                ctx.lineTo(x + w - 20, y + 40);
                ctx.stroke();
                ctx.fillStyle = '#2a1a0d';
                ctx.font = '5.5px "Special Elite", "Cinzel", serif';
                ctx.textAlign = 'left';
                const rules = isRight ? [
                    '7. The owner of the note can recognize',
                    '   the image and voice of its original owner.',
                    '8. The human who uses this note can',
                    '   neither go to Heaven nor Hell.',
                    '9. If the time of death is written,',
                    '   it will happen at that time.',
                    '10. The note shall never be exhausted;',
                    '    the pages are endless.',
                    '11. Only by touching the cover can a',
                    '    human who is not the owner use the note.',
                    '12. The Shinigami must not stay in',
                    '    the human world without reason.'
                ] : [
                    '1. The human whose name is written',
                    '   in this note shall die.',
                    '2. This note will not take effect',
                    '   unless the writer has the person\'s',
                    '   face in mind.',
                    '3. If the cause of death is written',
                    '   within 40 seconds, it will happen.',
                    '4. If the cause is not specified,',
                    '   death is by heart attack.',
                    '5. Details of death should be',
                    '   written within 6 min 40 sec.',
                    '6. This note becomes property of',
                    '   the human world once it touches',
                    '   the ground.'
                ];
                let ry = y + 60;
                rules.forEach(rule => {
                    ctx.fillText(rule, x + 25, ry);
                    ry += 16;
                });
                ctx.fillStyle = '#6a5a3a';
                ctx.font = '8px "Cinzel", serif';
                ctx.textAlign = 'center';
                ctx.fillText('— DEATH NOTE —', x + w/2, y + h - 25);
            }

            function drawClosedCover(offsetX, offsetY) {
                const x = CENTER_X - CLOSED_W/2 + offsetX;
                const y = CENTER_Y - CLOSED_H/2 + offsetY;
                const grad = ctx.createLinearGradient(x, y, x, y + CLOSED_H);
                grad.addColorStop(0, '#1e1e1e');
                grad.addColorStop(0.5, '#0a0a0a');
                grad.addColorStop(1, '#1e1e1e');
                ctx.fillStyle = grad;
                ctx.fillRect(x, y, CLOSED_W, CLOSED_H);
                ctx.strokeStyle = '#2a2a2a';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 5, y + 5, CLOSED_W - 10, CLOSED_H - 10);
                ctx.strokeStyle = 'rgba(139,100,60,0.4)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x + 15, y + 15, CLOSED_W - 30, CLOSED_H - 30);
                ctx.fillStyle = '#e8e8e8';
                ctx.font = 'bold 26px "UnifrakturCook", "Cinzel", serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('DEATH NOTE', x + CLOSED_W/2, y + CLOSED_H/2 - 20);
                ctx.fillStyle = '#888';
                ctx.font = '8px "Cinzel", serif';
                ctx.fillText('SHINIGAMI EDITION', x + CLOSED_W/2, y + CLOSED_H/2 + 25);
                ctx.fillStyle = '#8a7050';
                ctx.font = '22px "Cinzel", serif';
                ctx.fillText('☠', x + CLOSED_W/2, y + CLOSED_H/2 + 75);
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(x - 4, y, 4, CLOSED_H);
            }

            function drawOpeningCover(angle) {
                const pivotX = CENTER_X - SPINE_W/2;
                const pivotY = CENTER_Y;
                const coverW = OPEN_W;
                const coverH = OPEN_H;
                ctx.save();
                ctx.translate(pivotX, pivotY);
                const scaleX = Math.cos(angle);
                if (Math.abs(scaleX) > 0.02) {
                    ctx.scale(scaleX, 1);
                    const grad = ctx.createLinearGradient(0, -coverH/2, 0, coverH/2);
                    grad.addColorStop(0, '#1e1e1e');
                    grad.addColorStop(0.5, '#0a0a0a');
                    grad.addColorStop(1, '#1e1e1e');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, -coverH/2, coverW, coverH);
                    ctx.strokeStyle = '#2a2a2a';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(4, -coverH/2 + 4, coverW - 8, coverH - 8);
                    ctx.fillStyle = '#e8e8e8';
                    ctx.font = 'bold 24px "UnifrakturCook", "Cinzel", serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('DEATH NOTE', coverW/2, -20);
                    ctx.fillStyle = '#888';
                    ctx.font = '7px "Cinzel", serif';
                    ctx.fillText('SHINIGAMI EDITION', coverW/2, 20);
                    ctx.fillStyle = '#8a7050';
                    ctx.font = '18px "Cinzel", serif';
                    ctx.fillText('☠', coverW/2, 60);
                } else {
                    ctx.fillStyle = '#1a1512';
                    ctx.fillRect(-1, -coverH/2, 2, coverH);
                }
                ctx.restore();
            }

            function drawFlippingRule(progress) {
                const pivotX = CENTER_X - SPINE_W/2;
                const pivotY = CENTER_Y;
                const pageW = PAGE_W;
                const pageH = PAGE_H;
                ctx.save();
                ctx.translate(pivotX, pivotY);
                const angle = -Math.PI * progress;
                const scaleX = Math.cos(angle);
                if (Math.abs(scaleX) > 0.02) {
                    ctx.scale(scaleX, 1);
                    ctx.fillStyle = '#f0e6d0';
                    ctx.fillRect(0, -pageH/2, pageW, pageH);
                    ctx.strokeStyle = 'rgba(139,0,0,0.5)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(8, -pageH/2 + 8, pageW - 16, pageH - 16);
                    ctx.fillStyle = '#8b0000';
                    ctx.font = 'bold 11px "UnifrakturCook", "Cinzel", serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('RULES', pageW/2, -pageH/2 + 25);
                    ctx.fillStyle = '#2a1a0d';
                    ctx.font = '5px "Special Elite", "Cinzel", serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'alphabetic';
                    const rules = [
                        '1. The human whose name is written',
                        '   in this note shall die.',
                        '2. This note will not take effect',
                        '   unless the writer has the person\'s',
                        '   face in mind.',
                        '3. If the cause of death is written',
                        '   within 40 seconds, it will happen.',
                        '4. If the cause is not specified,',
                        '   death is by heart attack.'
                    ];
                    let ry = -pageH/2 + 50;
                    rules.forEach(rule => {
                        ctx.fillText(rule, 20, ry);
                        ry += 14;
                    });
                } else {
                    ctx.fillStyle = '#e0d4b8';
                    ctx.fillRect(-1, -pageH/2, 2, pageH);
                }
                ctx.restore();
            }

            function drawOpenBook() {
                drawSpine(CENTER_X, CENTER_Y - PAGE_H/2, SPINE_W, PAGE_H);
                drawNotebookPage(CENTER_X - SPINE_W/2 - PAGE_W, CENTER_Y - PAGE_H/2, PAGE_W, PAGE_H);
                drawNotebookPage(CENTER_X + SPINE_W/2, CENTER_Y - PAGE_H/2, PAGE_W, PAGE_H);
                ctx.save();
                ctx.globalAlpha = 0.25;
                const pivotX = CENTER_X - SPINE_W/2;
                const pivotY = CENTER_Y;
                ctx.translate(pivotX, pivotY);
                ctx.scale(-1, 1);
                const grad = ctx.createLinearGradient(0, -PAGE_H/2, 0, PAGE_H/2);
                grad.addColorStop(0, '#1e1e1e');
                grad.addColorStop(0.5, '#0a0a0a');
                grad.addColorStop(1, '#1e1e1e');
                ctx.fillStyle = grad;
                ctx.fillRect(0, -PAGE_H/2, OPEN_W, PAGE_H);
                ctx.restore();
            }

            function drawBook() {
                ctx.clearRect(0, 0, W, H);
                if (animState === 'dropping') {
                    const t = easeInOutCubic(dropProgress);
                    const offsetY = (1 - t) * -100;
                    drawClosedCover(0, offsetY);
                } else if (animState === 'coverOpening') {
                    drawOpenBook();
                    drawOpeningCover(coverAngle);
                    if (coverAngle < -Math.PI/2) {
                        const fp = Math.min(1, (-coverAngle - Math.PI/2) / (Math.PI/2));
                        drawFlippingRule(fp);
                    }
                } else if (animState === 'flipping') {
                    drawOpenBook();
                    drawFlippingRule(flipProgress);
                    ctx.save();
                    ctx.globalAlpha = 0.25;
                    drawOpeningCover(-Math.PI);
                    ctx.restore();
                } else {
                    drawOpenBook();
                }
            }

            function startBookAnimation() {
                animState = 'dropping';
                animStartTime = performance.now();
                requestAnimationFrame(animateBook);
            }

            function animateBook() {
                if (animStartTime === null) animStartTime = performance.now();
                const elapsed = performance.now() - animStartTime;

                if (animState === 'dropping') {
                    dropProgress = Math.min(elapsed / DROP_DURATION, 1);
                    if (dropProgress >= 1) {
                        animState = 'coverOpening';
                        animStartTime = performance.now();
                    }
                } else if (animState === 'coverOpening') {
                    const progress = Math.min(elapsed / COVER_OPEN_DURATION, 1);
                    coverAngle = -Math.PI * easeInOutCubic(progress);
                    if (progress >= 1) {
                        animState = 'flipping';
                        animStartTime = performance.now();
                    }
                } else if (animState === 'flipping') {
                    flipProgress = Math.min(elapsed / FLIP_DURATION, 1);
                    if (flipProgress >= 1) {
                        animState = 'done';
                        document.getElementById('form-container').classList.add('visible');
                        spawnAllDanmaku();
                    }
                }

                drawBook();

                if (animState !== 'done') {
                    requestAnimationFrame(animateBook);
                }
            }

            // ========== 提交逻辑 ==========
            const formContainer = document.getElementById('form-container');
            const lightScene = document.getElementById('light-scene');
            const redOverlay = document.getElementById('red-overlay');
            const abyssVortex = document.getElementById('abyss-vortex');
            const watermark = document.getElementById('watermark');
            const submitBtn = document.getElementById('submit-btn');
            const nameInput = document.getElementById('name-input');
            const timeInput = document.getElementById('time-input');
            const eventInput = document.getElementById('event-input');
            let isTransitioning = false;

            submitBtn.addEventListener('click', () => {
                if (isTransitioning) return;
                const name = nameInput.value.trim();
                const time = timeInput.value.trim();
                const event = eventInput.value.trim();
                if (!name || !time) { alert('请至少填写名字和死亡时间。'); return; }
                isTransitioning = true;
                saveRecord(name, time, event);
                spawnDanmaku({ name, time, event }, 0);
                formContainer.classList.add('fade-out');
                watermark.classList.add('hidden');
                setTimeout(() => abyssVortex.classList.add('active'), 300);
                setTimeout(() => bookCanvas.classList.add('fly-away'), 500);
                setTimeout(() => {
                    bookCanvas.style.display = 'none';
                    lightScene.classList.add('visible');
                    setTimeout(() => {
                        redOverlay.classList.add('active');
                        lightScene.classList.add('red-eye');
                    }, 700);
                    spawnAllDanmaku();
                }, 2400);
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && formContainer.classList.contains('visible') && !isTransitioning) submitBtn.click();
            });

            [nameInput, timeInput, eventInput].forEach(inp => {
                inp.addEventListener('focus', function() { this.parentElement.style.transform = 'scale(1.03)'; this.parentElement.style.transition = 'transform 0.3s ease'; });
                inp.addEventListener('blur', function() { this.parentElement.style.transform = 'scale(1)'; });
            });

            console.log('☠ DEATH NOTE — 恐怖弹窗+Canvas笔记本+音乐 — 仅供娱乐 ☠');
            console.log('音乐文件: the-kness.mp3 (请放在同目录)');
            console.log('图片文件: yagami-light.png (请放在同目录)');
        })();
    </script>
</body>
</html>
